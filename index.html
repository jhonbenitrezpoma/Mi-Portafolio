<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Académico - UPLA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- PANTALLA INICIAL: LOGIN / REGISTRO -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <div class="logo-upla-login">
                <img src="https://upla.edu.pe/wp-content/uploads/2021/07/LOGO-UPLA.png" alt="Logo UPLA" class="img-upla">
            </div>
            <h2>Portafolio Académico UPLA</h2>
            
            <!-- Pestañas de Login / Registro -->
            <div class="auth-tabs">
                <button id="tabLoginBtn" class="auth-tab-btn active" onclick="mostrarTab('login')">Iniciar Sesión</button>
                <button id="tabRegisterBtn" class="auth-tab-btn" onclick="mostrarTab('register')">Registrarse</button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="formLogin" onsubmit="procesarLogin(event)">
                <div class="form-group">
                    <label>Usuario / Estudiante:</label>
                    <input type="text" id="loginUsuario" placeholder="Ej: Jhon Benitrez o tu usuario" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="loginPass" placeholder="Propietario usa clave / Visitante vacio">
                </div>
                <button type="submit" class="btn-primary btn-block">Ingresar al Portafolio</button>
            </form>

            <!-- Formulario de Registro para Visitantes -->
            <form id="formRegister" class="contenido-oculto" onsubmit="procesarRegistro(event)">
                <div class="form-group">
                    <label>Tu Nombre Completo:</label>
                    <input type="text" id="regNombre" placeholder="Ej: María López" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="regCorreo" placeholder="correo@ejemplo.com" required>
                </div>
                <button type="submit" class="btn-primary btn-block">Crear Cuenta de Visitante</button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DEL PORTAFOLIO -->
    <div id="contenidoPrincipal" class="contenido-oculto">
        
        <!-- Header con Logo UPLA -->
        <header class="navbar">
            <div class="logo-container">
                <img src="https://upla.edu.pe/wp-content/uploads/2021/07/LOGO-UPLA.png" alt="Logo UPLA" class="img-upla-header">
                <div>
                    <h1>Portafolio Académico</h1>
                    <p>Universidad Peruana Los Andes</p>
                </div>
            </div>
            
            <div class="user-info">
                <span id="userNameDisplay" class="user-name">Usuario</span>
                <span id="userRoleBadge" class="badge">Rol</span>
                <button onclick="cerrarSesion()" class="btn-secundary">Salir / Cambiar</button>
            </div>
        </header>

        <!-- Mensaje de Bienvenida -->
        <section class="hero-welcome">
            <h2 id="saludoBienvenida">👋 ¡Hola! Bienvenid@ al Portafolio</h2>
            <p>Explora la entrega de tareas organizadas por cursos, unidades y semanas académicas.</p>
        </section>

        <div class="layout">
            <!-- Barra lateral de Cursos -->
            <aside class="sidebar">
                <h3>Mis Cursos</h3>
                <button class="course-btn active" onclick="cambiarCurso('curso1')">💻 Curso 1: Programación Web</button>
                <button class="course-btn" onclick="cambiarCurso('curso2')">🗄️ Curso 2: Bases de Datos</button>
            </aside>

            <!-- Área de Unidades y Semanas -->
            <main class="main-content">
                <h2 id="tituloCurso">Curso 1: Programación Web</h2>

                <div class="unidades-tabs">
                    <button class="tab-btn active" onclick="mostrarUnidad(1)">Unidad 1</button>
                    <button class="tab-btn" onclick="mostrarUnidad(2)">Unidad 2</button>
                    <button class="tab-btn" onclick="mostrarUnidad(3)">Unidad 3</button>
                    <button class="tab-btn" onclick="mostrarUnidad(4)">Unidad 4</button>
                </div>

                <div id="semanasContainer" class="semanas-container">
                    <!-- Tarjetas cargadas vía JavaScript -->
                </div>
            </main>
        </div>

    </div>

    <script>
        // BASE DE TAREAS INICIALES EN GITHUB
        const TAREAS_OFICIALES = {
            "curso1_U1_S1": { nombre: "Tarea 1: Estructura HTML Base", url: "tareas/tarea1.pdf" },
            "curso2_U1_S1": { nombre: "Tarea 1: Diseños de BD", url: "tareas/bd1.pdf" }
        };

        let usuarioActual = null;
        let esPropietario = false;
        let cursoActual = 'curso1';
        let unidadActual = 1;

        const nombresCursos = {
            curso1: "💻 Curso 1: Programación Web",
            curso2: "🗄️ Curso 2: Bases de Datos"
        };

        document.addEventListener("DOMContentLoaded", () => {
            verificarSesionGuardada();
        });

        function mostrarTab(tab) {
            if (tab === 'login') {
                document.getElementById('formLogin').classList.remove('contenido-oculto');
                document.getElementById('formRegister').classList.add('contenido-oculto');
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('tabRegisterBtn').classList.remove('active');
            } else {
                document.getElementById('formLogin').classList.add('contenido-oculto');
                document.getElementById('formRegister').classList.remove('contenido-oculto');
                document.getElementById('tabRegisterBtn').classList.add('active');
                document.getElementById('tabLoginBtn').classList.remove('active');
            }
        }

        // VALIDACIÓN DE INICIO DE SESIÓN
        function procesarLogin(e) {
            e.preventDefault();
            const inputUser = document.getElementById("loginUsuario").value.trim().toLowerCase();
            const inputPass = document.getElementById("loginPass").value.trim();

            // Permite tanto "jhon benitrez" como "jhon benitres" con la clave 123456789
            if ((inputUser === "jhon benitrez" || inputUser === "jhon benitres") && inputPass === "123456789") {
                esPropietario = true;
                usuarioActual = "Jhon Benitrez";
            } else {
                esPropietario = false;
                usuarioActual = document.getElementById("loginUsuario").value.trim();
            }

            const sesion = { nombre: usuarioActual, esAdmin: esPropietario };
            localStorage.setItem("sesion_portafolio_upla", JSON.stringify(sesion));
            iniciarInterfaz();
        }

        function procesarRegistro(e) {
            e.preventDefault();
            const nombre = document.getElementById("regNombre").value.trim();
            esPropietario = false;
            usuarioActual = nombre;

            const sesion = { nombre: usuarioActual, esAdmin: false };
            localStorage.setItem("sesion_portafolio_upla", JSON.stringify(sesion));
            iniciarInterfaz();
        }

        function verificarSesionGuardada() {
            const sesion = JSON.parse(localStorage.getItem("sesion_portafolio_upla"));
            if (sesion) {
                usuarioActual = sesion.nombre;
                esPropietario = sesion.esAdmin;
                iniciarInterfaz();
            } else {
                document.getElementById("loginOverlay").style.display = "flex";
                document.getElementById("contenidoPrincipal").classList.add("contenido-oculto");
            }
        }

        function iniciarInterfaz() {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("contenidoPrincipal").classList.remove("contenido-oculto");

            document.getElementById("userNameDisplay").innerText = usuarioActual;
            document.getElementById("saludoBienvenida").innerText = `👋 ¡Hola, ${usuarioActual}! Bienvenid@ al Portafolio Académico`;

            const badge = document.getElementById("userRoleBadge");
            if (esPropietario) {
                badge.innerText = "👑 Propietario";
                badge.className = "badge badge-admin";
            } else {
                badge.innerText = "👁️ Visitante";
                badge.className = "badge badge-visitor";
            }

            renderizarUnidad();
        }

        function cerrarSesion() {
            localStorage.removeItem("sesion_portafolio_upla");
            location.reload();
        }

        function cambiarCurso(idCurso) {
            cursoActual = idCurso;
            document.getElementById("tituloCurso").innerText = nombresCursos[idCurso];
            document.querySelectorAll(".course-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            mostrarUnidad(1);
        }

        function mostrarUnidad(numUnidad) {
            unidadActual = numUnidad;
            document.querySelectorAll(".tab-btn").forEach((btn, index) => {
                btn.classList.toggle("active", index + 1 === numUnidad);
            });
            renderizarUnidad();
        }

        function renderizarUnidad() {
            const container = document.getElementById("semanasContainer");
            container.innerHTML = "";

            const semanaInicio = (unidadActual - 1) * 4 + 1;

            for (let i = 0; i < 4; i++) {
                const numSemana = semanaInicio + i;
                const keyTarea = `${cursoActual}_U${unidadActual}_S${numSemana}`;

                const tareaOficial = TAREAS_OFICIALES[keyTarea];
                const tareaBorrada = localStorage.getItem("borrada_" + keyTarea);
                const tareaLocal = JSON.parse(localStorage.getItem("local_" + keyTarea));

                let tareaAMostrar = null;

                if (tareaLocal) {
                    tareaAMostrar = tareaLocal;
                } else if (tareaOficial && !tareaBorrada) {
                    tareaAMostrar = { nombreArchivo: tareaOficial.nombre, contenido: tareaOficial.url };
                }

                const semanaCard = document.createElement("div");
                semanaCard.className = "semana-card";

                let htmlContent = `
                    <h4>Semana ${numSemana}</h4>
                    <div class="tarea-info">
                `;

                if (tareaAMostrar) {
                    htmlContent += `
                        <p class="status-ok">✔ Tarea disponible:</p>
                        <p class="tarea-nombre"><strong>${tareaAMostrar.nombreArchivo}</strong></p>
                        <a href="${tareaAMostrar.contenido}" target="_blank" class="btn-download">📄 Abrir / Ver Tarea</a>
                    `;

                    // Si eres Propietario, se activan los botones de edición y borrado
                    if (esPropietario) {
                        htmlContent += `
                            <div class="admin-actions">
                                <label class="btn-edit">
                                    ✏️ Editar Tarea
                                    <input type="file" onchange="subirTareaPropietario(event, '${keyTarea}')" style="display:none;">
                                </label>
                                <button class="btn-delete" onclick="borrarTarea('${keyTarea}')">🗑️ Borrar Tarea</button>
                            </div>
                        `;
                    }
                } else {
                    htmlContent += `
                        <p class="status-empty">Sin tarea asignada en esta semana</p>
                    `;

                    if (esPropietario) {
                        htmlContent += `
                            <label class="btn-upload">
                                📤 Subir Tarea Nueva
                                <input type="file" onchange="subirTareaPropietario(event, '${keyTarea}')" style="display:none;">
                            </label>
                        `;
                    }
                }

                htmlContent += `</div>`;
                semanaCard.innerHTML = htmlContent;
                container.appendChild(semanaCard);
            }
        }

        function subirTareaPropietario(event, keyTarea) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const datosTarea = {
                    nombreArchivo: archivo.name,
                    contenido: e.target.result
                };
                localStorage.removeItem("borrada_" + keyTarea);
                localStorage.setItem("local_" + keyTarea, JSON.stringify(datosTarea));
                renderizarUnidad();
            };
            reader.readAsDataURL(archivo);
        }

        function borrarTarea(keyTarea) {
            if (confirm("¿Estás seguro de borrar esta tarea de esta semana?")) {
                localStorage.removeItem("local_" + keyTarea);
                localStorage.setItem("borrada_" + keyTarea, "true");
                renderizarUnidad();
            }
        }
    </script>
</body>
</html>
